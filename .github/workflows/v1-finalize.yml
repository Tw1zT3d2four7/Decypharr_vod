name: v1.0.0 final large-library maintenance

on:
  push:
    branches: [v1.0.0]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v1.0.0-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.0.0
          fetch-depth: 1
      - name: Apply bounded-memory scanner and docs
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          p=Path('plugin.py')
          s=p.read_text()

          # Digest helpers let progressive discovery calculate a whole-library
          # signature without retaining the entire media inventory in RAM.
          if 'def _inventory_item_digest(' not in s:
              marker='def _metadata_state_load():'
              helpers='''def _inventory_item_digest(item):\n    row = {\n        "kind": item.get("kind"),\n        "path": os.path.realpath(str(item.get("path") or "")),\n        "api_url": item.get("api_url") or "",\n        "info_hash": item.get("info_hash") or "",\n        "file_path": item.get("file_path") or "",\n        "file_name": item.get("file_name") or "",\n        "release_name": item.get("release_name") or "",\n        "episode": list(item.get("episode") or []),\n    }\n    return hashlib.sha256(json.dumps(row, sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode("utf-8")).digest()\n\n\ndef _inventory_signature_from_digests(digests):\n    accumulator = bytearray(32)\n    for digest in digests:\n        for index, value in enumerate(digest):\n            accumulator[index] ^= value\n    return bytes(accumulator).hex()\n\n\n'''
              s=s.replace(marker,helpers+marker,1)

          # Persistent metadata queue: progressive scans enqueue lightweight
          # JSON records instead of retaining every media object in memory.
          if 'METADATA_QUEUE_FILE = ' not in s:
              marker='def _metadata_state_load():'
              queue='''METADATA_QUEUE_FILE = os.path.join(STATE_DIR, "metadata_queue.jsonl")\n\n\ndef _metadata_queue_reset():\n    os.makedirs(STATE_DIR, exist_ok=True)\n    tmp = METADATA_QUEUE_FILE + ".tmp"\n    with open(tmp, "w", encoding="utf-8"):\n        pass\n    os.replace(tmp, METADATA_QUEUE_FILE)\n\n\ndef _metadata_queue_append(item):\n    os.makedirs(STATE_DIR, exist_ok=True)\n    payload = {k: item.get(k) for k in ("kind", "path", "api_url", "episode", "info_hash", "file_path", "release_name", "file_name", "season_pack")}\n    with open(METADATA_QUEUE_FILE, "a", encoding="utf-8") as handle:\n        handle.write(json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\\n")\n\n\ndef _metadata_queue_batch(offset=0, limit=10):\n    items=[]\n    try:\n        with open(METADATA_QUEUE_FILE, encoding="utf-8") as handle:\n            handle.seek(max(0, int(offset or 0)))\n            while len(items) < max(1, int(limit or 1)):\n                line=handle.readline()\n                if not line: return items, handle.tell()\n                try: item=json.loads(line)\n                except Exception: continue\n                if isinstance(item, dict) and item.get("api_url"): items.append(item)\n            return items, handle.tell()\n    except FileNotFoundError:\n        return [], 0\n\n\ndef _metadata_queue_has_items(offset=0):\n    try: return os.path.getsize(METADATA_QUEUE_FILE) > max(0, int(offset or 0))\n    except OSError: return False\n\n\n'''
              s=s.replace(marker,queue+marker,1)

          # Discovery gets a collect switch and normalizes each complete
          # release before emitting it. Thus a progressive batch never sees
          # half of a season pack and never needs a second whole-library pass.
          s=s.replace('def _discover_media(root, api_url=None, api_token=None, batch_callback=None, batch_size=200):', 'def _discover_media(root, api_url=None, api_token=None, batch_callback=None, batch_size=200, collect=True, inventory_digest_callback=None):',1)
          s=s.replace('    discovered = []\n    virtual_root = os.path.realpath(root)', '    discovered = []\n    virtual_root = os.path.realpath(root)',1)
          old='''            discovered.append(item)\n            pending_batch.append(item)'''
          new='''            pending_batch.append(item)\n            if inventory_digest_callback:\n                inventory_digest_callback(_inventory_item_digest(item))\n            if collect:\n                discovered.append(item)'''
          if old not in s: raise SystemExit('discovery append anchor missing')
          s=s.replace(old,new,1)
          # Normalize one release at a time before the batch callback.
          old='''        for child in files:\n            name = _api_file_name(child)'''
          new='''        release_items = []\n        for child in files:\n            name = _api_file_name(child)'''
          s=s.replace(old,new,1)
          # The existing function uses item directly; make a local release
          # list by replacing the append/callback block with a release buffer.
          old='''            pending_batch.append(item)\n            if inventory_digest_callback:\n                inventory_digest_callback(_inventory_item_digest(item))\n            if collect:\n                discovered.append(item)\n            if batch_callback and batch_size > 0 and len(pending_batch) >= int(batch_size):\n                batch_callback(pending_batch)\n                pending_batch = []'''
          new='''            release_items.append(item)\n\n        release_items = _normalize_season_pack_items(release_items)\n        for item in release_items:\n            pending_batch.append(item)\n            if inventory_digest_callback:\n                inventory_digest_callback(_inventory_item_digest(item))\n            if collect:\n                discovered.append(item)\n            if batch_callback and batch_size > 0 and len(pending_batch) >= int(batch_size):\n                batch_callback(pending_batch)\n                pending_batch = []'''
          if old not in s: raise SystemExit('release buffering anchor missing')
          s=s.replace(old,new,1)

          # Progressive state is now a true streaming path.
          s=s.replace('''        progressive_seen = {\n            "movies": set(),\n            "episodes": set(),\n            "series": set(),\n            "series_relations": set(),\n            "files": set(),\n        }\n\n        def progressive_batch(batch):''','''        progressive_seen = {\n            "movies": set(),\n            "episodes": set(),\n            "series": set(),\n            "series_relations": set(),\n            "files": set(),\n        }\n        progressive_digests = []\n        if progressive_fast and not enrich_only:\n            _metadata_queue_reset()\n\n        def progressive_digest(digest):\n            progressive_digests.append(digest)\n\n        def progressive_batch(batch):''',1)
          # Do not retain digest objects either: only 32-byte digests are kept.
          # This is bounded by release count rather than media metadata; the
          # inventory signature can be folded incrementally below.
          s=s.replace('''            # Only import classifications that are already structurally\n            # certain.  season_file entries require the complete release\n            # inventory before episode numbers can be assigned, so they are\n            # deliberately deferred until _discover_media() has finished.\n            batch = _dedupe_discovered_media(batch)\n            for item in batch:\n                if item.get("kind") == "season_file":\n                    continue''','''            batch = _dedupe_discovered_media(batch)\n            for item in batch:\n                if item.get("kind") == "season_file":\n                    continue''',1)
          # Queue every progressive item for later metadata enrichment.
          anchor='''                    _fast_import_item(\n                        account,\n                        item,\n                        lib,\n                        progressive_seen["files"],\n                        progressive_seen["movies"],\n                        progressive_seen["episodes"],\n                        progressive_seen["series"],\n                        progressive_seen["series_relations"],\n                    )'''
          replacement=anchor+'''\n                    _metadata_queue_append(item)'''
          if anchor not in s: raise SystemExit('progressive import anchor missing')
          s=s.replace(anchor,replacement,1)

          old='''        media = _discover_media(\n            root,\n            API_BASE_URL,\n            API_TOKEN,\n            batch_callback=progressive_batch if progressive_fast else None,\n            batch_size=max(25, min(1000, int(settings.get("progressive_batch_size", 200) or 200))),\n        )\n        media = _dedupe_discovered_media(media)'''
          new='''        media = _discover_media(\n            root,\n            API_BASE_URL,\n            API_TOKEN,\n            batch_callback=progressive_batch if progressive_fast else None,\n            batch_size=max(25, min(1000, int(settings.get("progressive_batch_size", 200) or 200))),\n            collect=not progressive_fast,\n            inventory_digest_callback=progressive_digest if progressive_fast else None,\n        )\n        if not progressive_fast:\n            media = _dedupe_discovered_media(media)'''
          if old not in s: raise SystemExit('discover call anchor missing')
          s=s.replace(old,new,1)

          # Replace the old second whole-library season-pack pass.
          start=s.index('        if progressive_fast and not enrich_only:')
          end=s.index('\n        inventory_signature = _inventory_signature(media)', start)
          replacement='''        if progressive_fast and not enrich_only:\n            inventory_signature = _inventory_signature_from_digests(progressive_digests)\n            _cleanup_library(lib, progressive_seen["files"])\n            M3UMovieRelation.objects.filter(m3u_account=account).exclude(id__in=progressive_seen["movies"]).delete()\n            M3UEpisodeRelation.objects.filter(m3u_account=account).exclude(id__in=progressive_seen["episodes"]).delete()\n            M3USeriesRelation.objects.filter(m3u_account=account).exclude(id__in=progressive_seen["series_relations"]).delete()\n            _cleanup_legacy_categories(account)\n            metadata_state = {\n                "inventory_signature": inventory_signature,\n                "pending": [],\n                "pending_queue": "metadata_queue.jsonl",\n                "queue_offset": 0,\n                "updated": time.time(),\n            }\n            _metadata_state_save(metadata_state)\n            _link_next_episode_metadata(account)\n            _store_inventory_signature(inventory_signature)\n            return {\n                "status": "ok",\n                "mode": "fast_initial_progressive",\n                "message": "Fast initial catalog is ready; metadata enrichment is queued in bounded batches.",\n                "movies": len(progressive_seen["movies"]),\n                "episodes": len(progressive_seen["episodes"]),\n                "discovered": len(progressive_seen["movies"]) + len(progressive_seen["episodes"]),\n            }\n'''
          s=s[:start]+replacement+s[end:]

          # Queue-aware background enrichment. It consumes only a small batch.
          old='''        if background and not force and inventory_signature == _stored_inventory_signature():\n            if not (metadata_state.get("pending") or []):\n                return {\n                    "status": "unchanged",\n                    "message": "No Decypharr media changes detected; scan skipped.",\n                    "discovered": len(media),\n                }\n            enrich_only = True'''
          new='''        if background and not force and inventory_signature == _stored_inventory_signature():\n            queue_offset = int(metadata_state.get("queue_offset") or 0)\n            if not (metadata_state.get("pending") or []) and not _metadata_queue_has_items(queue_offset):\n                return {\n                    "status": "unchanged",\n                    "message": "No Decypharr media changes detected; scan skipped.",\n                    "discovered": len(media),\n                }\n            enrich_only = True'''
          if old not in s: raise SystemExit('background anchor missing')
          s=s.replace(old,new,1)

          old='''        if enrich_only:\n            pending = set(metadata_state.get("pending") or [])\n            if not pending:\n                return {"status": "unchanged", "message": "Metadata enrichment is complete."}\n            batch_size = max(1, int(cfg.get("metadata_batch_size", 25) or 25))\n            selected = []\n            for item in media:\n                if _media_state_key(item) in pending and len(selected) < batch_size:\n                    selected.append(item)\n            media = selected\n            LOG.info("Decypharr VOD: metadata enrichment batch %d", len(media))'''
          new='''        queue_items = []\n        queue_next_offset = int(metadata_state.get("queue_offset") or 0)\n        if enrich_only:\n            batch_size = max(1, int(cfg.get("metadata_batch_size", 25) or 25))\n            if _metadata_queue_has_items(queue_next_offset):\n                queue_items, queue_next_offset = _metadata_queue_batch(queue_next_offset, batch_size)\n                media = queue_items\n            else:\n                pending = set(metadata_state.get("pending") or [])\n                if not pending:\n                    return {"status": "unchanged", "message": "Metadata enrichment is complete."}\n                selected = []\n                for item in media:\n                    if _media_state_key(item) in pending and len(selected) < batch_size:\n                        selected.append(item)\n                media = selected\n            LOG.info("Decypharr VOD: metadata enrichment batch %d", len(media))'''
          if old not in s: raise SystemExit('enrichment anchor missing')
          s=s.replace(old,new,1)

          old='''        if enrich_only:\n            metadata_state["inventory_signature"] = inventory_signature\n            metadata_state["updated"] = time.time()\n            _metadata_state_save(metadata_state)\n            return {\n                "status": "ok",\n                "mode": "metadata_enrichment",\n                "movies": counts["movies"],\n                "episodes": counts["episodes"],\n                "skipped": counts["skipped"],\n                "remaining": len(metadata_state.get("pending") or []),\n            }'''
          new='''        if enrich_only:\n            if queue_items:\n                metadata_state["queue_offset"] = queue_next_offset\n                metadata_state["queue_updated"] = time.time()\n            metadata_state["inventory_signature"] = inventory_signature\n            metadata_state["updated"] = time.time()\n            _metadata_state_save(metadata_state)\n            remaining_queue = 0\n            try:\n                remaining_queue = max(0, os.path.getsize(METADATA_QUEUE_FILE) - int(metadata_state.get("queue_offset") or 0))\n            except OSError:\n                pass\n            return {\n                "status": "ok",\n                "mode": "metadata_enrichment",\n                "movies": counts["movies"],\n                "episodes": counts["episodes"],\n                "skipped": counts["skipped"],\n                "remaining": len(metadata_state.get("pending") or []),\n                "queue_bytes_remaining": remaining_queue,\n            }'''
          if old not in s: raise SystemExit('enrichment final anchor missing')
          s=s.replace(old,new,1)

          # Remove duplicate next-episode linkage in the progressive path.
          dup='''            _link_next_episode_metadata(account)\n\n            _store_inventory_signature(inventory_signature)\n            _link_next_episode_metadata(account)'''
          s=s.replace(dup,'''            _link_next_episode_metadata(account)\n\n            _store_inventory_signature(inventory_signature)''',1)

          # Version references must remain 1.0.0 throughout source/docs.
          s=re.sub(r'v0\.\d+(?:\.\d+)?','v1.0.0',s)
          p.write_text(s)

          r=Path('Readme.md')
          readme=r.read_text()
          readme=re.sub(r'\*\*Version:\*\*\s+[^\n]+','**Version:** 1.0.0',readme,count=1)
          section='''\n## Large Usenet-Style Library Scanner\n\nv1.0.0 is designed for very large Usenet-style Decypharr libraries. The initial scan uses a **true progressive, bounded-memory import path**: releases are classified independently, season packs are resolved before their batch is emitted, and playable Dispatcharr VOD records are created without retaining the complete media inventory in Python memory.\n\nThe progressive path no longer performs a second whole-library season-pack pass. Each release is normalized before it reaches the import callback, preventing obfuscated season-pack files from being misclassified as movies while also avoiding a full-library deferred list.\n\nFast-import records are placed into a persistent metadata queue. Expensive FFprobe/TMDB enrichment is processed in small batches after the playable catalog is available. This keeps the scan responsive and reduces the chance that a large initial scan interferes with active VOD playback.\n\nThe persistent Decypharr API inventory cache reuses unchanged release child inventories, and changed releases are fetched concurrently according to the **Decypharr API Workers** setting. The scanner also folds a compact inventory signature instead of retaining the complete media objects solely to calculate a scan signature.\n\nAutomatic scanning, manual Scan Now, metadata enrichment, and stale-library cleanup continue to use the same plugin-owned relations and `.strm` presentation library. A scan lock prevents overlapping scans from modifying the VOD database at the same time.\n'''
          if '## Large Usenet-Style Library Scanner' not in readme:
              readme += '\n'+section
          else:
              a=readme.index('## Large Usenet-Style Library Scanner')
              b=readme.find('\n## ',a+5)
              if b<0:b=len(readme)
              readme=readme[:a]+section.lstrip('\n')+readme[b:]
          readme=re.sub(r'v0\.\d+(?:\.\d+)?','v1.0.0',readme)
          r.write_text(readme)

          for name in ['plugin.json','Contributing to Decypharr.md']:
              q=Path(name)
              if q.exists(): q.write_text(re.sub(r'v0\.\d+(?:\.\d+)?','v1.0.0',q.read_text()))

          subprocess.run(['python3','-m','py_compile','plugin.py'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','plugin.py','Readme.md','plugin.json','Contributing to Decypharr.md'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode != 0:
              subprocess.run(['git','commit','-m','[v1.0.0-finalize] complete bounded-memory large-library scanner'],check=True)
              subprocess.run(['git','push','origin','HEAD:v1.0.0'],check=True)
          # Remove this temporary workflow after its work is committed.
          subprocess.run(['git','rm','-f','.github/workflows/v1-finalize.yml'],check=True)
          subprocess.run(['git','commit','-m','[v1.0.0-finalize] remove temporary maintenance workflow'],check=True)
          subprocess.run(['git','push','origin','HEAD:v1.0.0'],check=True)
